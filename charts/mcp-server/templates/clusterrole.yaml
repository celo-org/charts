apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mcp-server.fullname" . }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
rules:
  # Core API group (""): read every core resource EXCEPT secrets.
  # RBAC has no deny rule, so secrets are excluded by simply not granting
  # them here. A wildcard over resources would re-include secrets, so the
  # core resources are enumerated explicitly.
  - apiGroups: [""]
    resources:
      - bindings
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - pods/log
      - podtemplates
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
    verbs: ["get", "list", "watch"]
  # Non-core API groups: wildcard read. Secrets live only in the core group,
  # so wildcarding resources here cannot expose them. Covers the standard
  # built-in groups plus every custom CRD API group observed across the
  # target clusters: GKE platform, cert-manager, external-secrets, Envoy
  # and Gateway API, monitoring (Prometheus operator, Grafana, Google
  # Managed Prometheus), Trivy, Kong and others.
  # Listing a group that is absent on a given cluster is a harmless no-op;
  # add new CRD API groups here as they appear.
  - apiGroups:
      - "acme.cert-manager.io"
      - "admissionregistration.k8s.io"
      - "apiextensions.k8s.io"
      - "apiregistration.k8s.io"
      - "apps"
      - "auto.gke.io"
      - "autoscaling"
      - "autoscaling.gke.io"
      - "autoscaling.k8s.io"
      - "autoscaling.x-k8s.io"
      - "batch"
      - "cert-manager.io"
      - "certificates.k8s.io"
      - "cloud.google.com"
      - "configuration.konghq.com"
      - "coordination.k8s.io"
      - "datalayer.gke.io"
      - "discovery.k8s.io"
      - "events.k8s.io"
      - "external-secrets.io"
      - "flowcontrol.apiserver.k8s.io"
      - "gateway.envoyproxy.io"
      - "gateway.networking.k8s.io"
      - "gateway.networking.x-k8s.io"
      - "generators.external-secrets.io"
      - "hub.gke.io"
      - "inference.networking.k8s.io"
      - "internal.apiserver.k8s.io"
      - "internal.autoscaling.gke.io"
      - "internal.autoscaling.k8s.io"
      - "migration.k8s.io"
      - "monitoring.coreos.com"
      - "monitoring.gke.io"
      - "monitoring.googleapis.com"
      - "monitoring.grafana.com"
      - "networking.gke.io"
      - "networking.k8s.io"
      - "node.gke.io"
      - "node.k8s.io"
      - "nodemanagement.gke.io"
      - "policy"
      - "policy.sigstore.dev"
      - "rbac.authorization.k8s.io"
      - "resource.k8s.io"
      - "scalingpolicy.kope.io"
      - "scheduling.k8s.io"
      - "security.cloud.google.com"
      - "snapshot.storage.k8s.io"
      - "storage.k8s.io"
      - "storagemigration.k8s.io"
      - "warden.gke.io"
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Aqua Trivy Operator (aquasecurity.github.io): granted separately with
  # enumerated resources rather than a resource wildcard, so that
  # exposedsecretreports -- which record secret material discovered in
  # images/workloads -- stay excluded, consistent with the core-group
  # Secret exclusion. Add new Aqua report types here as needed, but do NOT
  # add exposedsecretreports.
  - apiGroups:
      - "aquasecurity.github.io"
    resources:
      - clustercompliancereports
      - clusterconfigauditreports
      - clusterinfraassessmentreports
      - clusterrbacassessmentreports
      - clustersbomreports
      - clustervulnerabilityreports
      - configauditreports
      - infraassessmentreports
      - rbacassessmentreports
      - sbomreports
      - vulnerabilityreports
    verbs: ["get", "list", "watch"]
