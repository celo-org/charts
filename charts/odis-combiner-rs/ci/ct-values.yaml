---
# Standalone settings for chart-testing. The combiner checks the full node's chain ID before it binds its
# port, so the install needs Celo Sepolia's public forno; the timeout is raised from the combiner's
# 1000 ms so that a slow answer does not fail the install. It calls no signer at startup, so the signer
# URLs only have to parse. The key is the 2-of-3 development key from social-connect
# (packages/common/src/test/values.ts, PNP_THRESHOLD_DEV_*_V1). It is listed as version 2, which is not
# the combiner's default, so the install fails if the chart stops passing currentKeyVersion on.
config:
  chainID: "11142220"
blockchain:
  provider: https://forno.celo-sepolia.celo-testnet.org
  fullNodeTimeoutMs: "10000"
pnp:
  signers:
    - url: http://signer0:3000
    - url: http://signer1:3000
    - url: http://signer2:3000
  currentKeyVersion: "2"
  keyVersions:
    - keyVersion: 2
      threshold: 2
      polynomial: ""
      pubKey: "61aeuHAdgxoKn/5d8yXu0qx/VpPHWMAqrVgEAJ/MpC7Oc/f1YLPiN7YKaw9eDWUBUWs4sPn6IN2UTGbt95jP6nO8IymD4IhbBONjLcElsq1jwTZ2cjuTHV9obSyDFl2B"
