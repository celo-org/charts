{{- if include "odis-combiner-rs.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "odis-combiner-rs.secretName" . }}
  labels:
    {{- include "odis-combiner-rs.labels" . | nindent 4 }}
type: Opaque
stringData:
  blockchain-api-key: {{ .Values.blockchain.apiKey | quote }}
{{- end }}
