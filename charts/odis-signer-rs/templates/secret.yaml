{{- if include "odis-signer-rs.createSecret" . }}
{{- $db := .Values.database }}
{{- $bc := .Values.blockchain }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "odis-signer-rs.secretName" . }}
  labels:
    {{- include "odis-signer-rs.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and (not $bc.apiKeyExistingSecret) $bc.apiKey }}
  blockchain-api-key: {{ $bc.apiKey | quote }}
  {{- end }}
  {{- if and (not $db.urlExistingSecret) $db.url }}
  database-url: {{ $db.url | quote }}
  {{- else if and (not $db.urlExistingSecret) $db.host (not $db.passwordExistingSecret) $db.password }}
  database-password: {{ $db.password | quote }}
  {{- end }}
{{- end }}
